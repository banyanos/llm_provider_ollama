[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-provider-ollama"
version = "1.0.0"
description = "Ollama provider plugin for BanyanOS llm_engine (native /api/chat over the pooled client)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ideabosque" },
]
dependencies = [
    "silvaengine_utility",
    "llm-provider-base>=1.0,<2",
    # Only ChatResponse / types are used (raw HTTP on the pooled client, D7).
    "ollama>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
]

[project.entry-points."banyan.llm_providers"]
ollama = "llm_provider_ollama:OllamaProvider"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_provider_ollama*"]

[tool.setuptools.package-data]
llm_provider_ollama = ["*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
